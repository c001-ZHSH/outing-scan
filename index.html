<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>學生外出掃描</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  * { box-sizing:border-box; }
  body { font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; margin:0; background:#0f172a; color:#e2e8f0; }
  .wrap { max-width:640px; margin:0 auto; padding:10px 12px; text-align:center; }
  h1 { font-size:17px; margin:2px 0 1px; }
  .sub { color:#94a3b8; font-size:12px; margin-bottom:8px; }
  .frame { position:relative; display:inline-block; width:100%; max-width:560px; }
  #video { width:100%; aspect-ratio:3/4; max-height:42vh; background:#111; border-radius:14px; object-fit:cover; }
  .reticle { position:absolute; left:10%; right:10%; top:40%; height:20%; border:3px solid rgba(147,197,253,.9); border-radius:12px; pointer-events:none; }
  .start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); border-radius:16px; }
  .btn { border:0; border-radius:14px; padding:16px 24px; font-size:19px; font-weight:800; cursor:pointer; background:#2563eb; color:#fff; }
  .btn.ghost { background:#334155; font-size:14px; padding:9px 14px; font-weight:600; }
  #status { margin:8px 0; font-size:13px; color:#64748b; min-height:18px; }

  #result { display:none; border-radius:14px; padding:12px; margin-top:10px; text-align:center; }
  #result.show { display:block; }
  #result.ok   { background:#064e3b; border:3px solid #10b981; }
  #result.ban  { background:#7f1d1d; border:3px solid #ef4444; }
  #result.none { background:#3f3f46; border:3px solid #a1a1aa; }
  #result.wait { background:#1e293b; border:3px solid #334155; }
  .verdict { font-size:26px; font-weight:900; }
  .name { font-size:24px; font-weight:900; margin-top:2px; }
  .meta { font-size:15px; color:#e5e7eb; margin-top:3px; }
  .notes { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip { font-weight:800; padding:7px 14px; border-radius:999px; font-size:18px; }
  .stamp { font-size:12px; color:#cbd5e1; margin-top:8px; }
  .footer { margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
    <h1 style="margin:2px 0;">🎫 學生外出掃描</h1>
    <a id="adminLink" class="btn ghost" target="_top" style="font-size:12px; padding:7px 10px; text-decoration:none;">⚙️ 管理／電腦版</a>
  </div>
  <div class="sub">相機會一直開著，連續掃、不用重按</div>

  <div id="desktopLanding" style="display:none; background:#1e293b; border-radius:14px; padding:22px; margin-top:8px;">
    <div style="font-size:17px; font-weight:700; margin-bottom:8px;">偵測到電腦 💻</div>
    <div class="sub" style="margin-bottom:16px;">電腦版有 USB 掃描器即時輸入與完整管理後台，建議使用電腦版。</div>
    <a class="btn" id="pcLink" target="_top" style="display:inline-block; text-decoration:none;">💻 進入電腦版（掃描器＋管理後台）</a>
    <div style="margin-top:14px;"><button class="btn ghost" onclick="useCameraHere()">或用這台電腦的相機掃描</button></div>
  </div>

  <div class="frame">
    <video id="video" muted playsinline autoplay></video>
    <div class="reticle"></div>
    <div class="start" id="startBox"><button class="btn" onclick="startScan()">▶ 開始掃描</button></div>
  </div>

  <div id="result"></div>

  <div class="footer">
    <button class="btn ghost" onclick="toggleManual()">⌨️ 手動輸入查詢</button>
    <button class="btn ghost" onclick="goLogin()">🔐 重新登入</button>
  </div>

  <div id="manualBox" style="display:none; margin-top:10px; text-align:left;">
    <input id="manualInput" placeholder="身分證／學號／姓名／班級座號 任一"
           style="width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:#fff; font-size:16px;">
    <button class="btn" style="margin-top:8px; width:100%;" onclick="manualQuery()">🔍 查詢</button>
    <div class="sub" style="margin-top:6px">查出的資料可核對身分，避免冒名；如需登記外出，點結果內的「登記」鈕。</div>
  </div>
  <div id="manualResults"></div>

  <div id="status">請按「開始掃描」並允許使用相機</div>
</div>

<script>
// 手機專用「匿名端點」網址（以通行碼驗證，可連續查詢）
var APP_URL = "https://script.google.com/macros/s/AKfycbxNgiG6CP8SW81SpAJDFummkLbm5_0BmbVjoCeXddHzErYDzDopzEm8g6bC23rOtTJh/exec";
// 電腦版／管理後台（Google 登入）；透過帳號選擇器確保挑到學校帳號
var APPSCRIPT_URL = "https://script.google.com/a/macros/mail2.chshs.ntpc.edu.tw/s/AKfycbxxdskve4W6xyWuqmtu9guQKtSLJRZFzydgfodqqboqE-ajQ3zDq1aVya-mnI6dIqO2/exec";
var ADMIN_URL = "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(APPSCRIPT_URL);
// 登入取得臨時權杖：導到網域端點 ?action=mobiletoken（Google 驗證），回來時網址帶 #t=權杖
var LOGIN_URL = "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(APPSCRIPT_URL + "?action=mobiletoken");

// 從網址 #t= 取得權杖，存進 sessionStorage（關掉分頁即消失），並把權杖從網址移除
var TOKEN = (function(){
  var m = (location.hash||'').match(/[#&]t=([^&]+)/);
  if (m){
    try { sessionStorage.setItem('scanToken', decodeURIComponent(m[1])); } catch(e){}
    try { history.replaceState(null,'',location.pathname+location.search); } catch(e){ location.hash=''; }
  }
  try { return sessionStorage.getItem('scanToken') || ''; } catch(e){ return ''; }
})();
function goLogin(){ location.href = LOGIN_URL; }
var reader = null, busy=false, lastCode='', lastTime=0, hideTimer=null, resumeTimer=null, SCANDB=null, refreshSet=false;

function say(t){ document.getElementById('status').textContent = t; }

// 只辨識學生證／身分證常見的條碼類型，加快速度
function makeReader(){
  var hints = null;
  try {
    hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
    ]);
  } catch(e){ hints = null; }
  var r = hints ? new ZXing.BrowserMultiFormatReader(hints) : new ZXing.BrowserMultiFormatReader();
  try { r.timeBetweenDecodingAttempts = 100; } catch(e){}   // 更頻繁嘗試，反應更快
  return r;
}

// 掃到就凍結畫面（給「已擷取」回饋）；顯示完再恢復即時畫面
function freezeFrame(){ var v=document.getElementById('video'); try{ v.pause(); }catch(e){} }
function scheduleResume(delay){
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeTimer = setTimeout(function(){
    var v=document.getElementById('video'); try{ v.play(); }catch(e){}
    busy = false;
  }, delay);
}

// ---- 音效（iPhone 需在使用者點擊時「解鎖」音訊）----
function actx(){ if(!window.__a){ try{ window.__a = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return window.__a; }
function unlockAudio(){
  var C=actx(); if(!C) return;
  try { if (C.state==='suspended') C.resume(); } catch(e){}
  try { var b=C.createBuffer(1,1,22050), s=C.createBufferSource(); s.buffer=b; s.connect(C.destination); s.start(0); } catch(e){}  // 觸發解鎖
}
function tone(freq,dur,type,when,gain){ var C=actx(); if(!C) return;
  try { if (C.state==='suspended') C.resume(); } catch(e){}
  try{ var o=C.createOscillator(),g=C.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(C.destination);
    var t=C.currentTime+(when||0), pk=gain||0.3;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(pk, t+0.012);          // 柔和起音
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);        // 自然衰減（更清脆好聽）
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){} }
function beep(){ tone(1400,0.06,'sine',0,0.18); }
function soundPass(){ tone(1318.5,0.10,'sine',0,0.3); tone(1760,0.16,'sine',0.085,0.28); }   // 上行「叮—叮」鈴聲
function soundWarn(){ for(var i=0;i<4;i++){ tone(240,0.16,'square',i*0.2,0.35); tone(360,0.16,'square',i*0.2+0.02,0.3);} }
function soundNone(){ tone(200,0.3,'triangle',0,0.25); }
// 從別的頁面切回來時，自動恢復音效（iPhone 會在切走時暫停音訊）
function resumeAudio(){ var C=actx(); if(C && C.state==='suspended'){ try{ C.resume(); }catch(e){} } }
document.addEventListener('visibilitychange', function(){ if(!document.hidden) resumeAudio(); });
window.addEventListener('pageshow', resumeAudio);
window.addEventListener('focus', resumeAudio);
document.addEventListener('touchstart', resumeAudio, {passive:true});   // 任何觸碰也確保音訊已恢復

function textColorFor(hex){ var c=String(hex||'').replace('#',''); if(c.length===3){c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];}
  if(c.length<6) return '#111827'; var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return ((0.299*r+0.587*g+0.114*b)/255)>0.62 ? '#111827' : '#ffffff'; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// ---- 啟動相機（連續）----
function startScan(){
  unlockAudio();          // 在點擊當下解鎖音訊（iPhone 必要）
  beep();
  if (!TOKEN){ goLogin(); return; }   // 未登入 → 先用學校帳號登入取得權杖
  if (typeof ZXing === 'undefined'){ say('掃描元件載入中，請幾秒後再按一次…'); return; }
  if (!reader) reader = makeReader();
  say('正在啟動相機…');
  var p = reader.decodeFromConstraints({ video:{ facingMode:{ ideal:'environment' } } }, 'video',
    function(result, err){ if (result) onDecode(result.getText()); });
  if (p && p.then){ p.then(onCameraReady)
                     .catch(function(e){ say('無法開啟相機（'+((e&&e.name)||e)+'），請確認已允許相機權限，再按一次開始。'); }); }
  else { onCameraReady(); }
}
function onCameraReady(){
  document.getElementById('startBox').style.display='none';
  say('相機已開啟，載入資料中…');
  loadDBMobile();
  if (!refreshSet){ refreshSet=true; setInterval(refreshDBMobile, 180000); }   // 每 3 分鐘更新資料
}

function onDecode(text){
  var code = String(text||'').trim(); if(!code) return;
  var now = Date.now();
  if (busy) return;
  if (code===lastCode && (now-lastTime)<2000) return;   // 同一張卡短時間不重複
  lastCode=code; lastTime=now; busy=true;
  freezeFrame();          // 凍結畫面，給「已擷取」回饋（結果的音效由 handleResult 播放）
  if (SCANDB){
    try {
      var d=new Date(), ex=locExtract(code), st=locLookup(ex), res;
      if (!st){ res={ ok:true, found:false, code:code, timeStr:fmtNow(d) }; }
      else { var ban=locBan(st,d), notes=locNotes(st,d);
        res={ ok:true, found:true, student:st, banned:ban.banned, ruleName:ban.ruleName, notes:notes, timeStr:fmtNow(d) }; }
      handleResult(res);
      logBeacon(code);      // 背景寫入記錄，不等待
    } catch(err){
      var r=document.getElementById('result'); r.className='show none';
      r.innerHTML='<div class="verdict">⚠️ 顯示錯誤</div><div class="meta">'+esc(String(err))+'</div>';
      scheduleResume(1500);
    }
  } else {
    // 尚未載入整包資料 → 即時查詢（備援，較慢）
    showWait();
    jsonp({ code:code, token:TOKEN }, function(data){ handleResult(data); });
  }
}

function jsonp(params, cb){
  var s=document.createElement('script');
  var name='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6), done=false;
  function cleanup(){ try{ delete window[name]; }catch(e){ window[name]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
  window[name]=function(d){ if(done)return; done=true; cleanup(); cb(d); };
  s.onerror=function(){ if(done)return; done=true; cleanup(); cb({ok:false,reason:'network'}); };
  var q=[]; for(var k in params){ q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  s.src=APP_URL+'?'+q.join('&')+'&callback='+name;
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){ done=true; cleanup(); cb({ok:false,reason:'timeout'}); } }, 12000);
}

// ---- 一次載入整包資料（之後本機即時比對）----
function loadDBMobile(cb){
  var r = document.getElementById('result');
  if (!TOKEN){ showLoginNeeded(); if(cb) cb(false); return; }
  jsonp({ action:'db', token:TOKEN }, function(data){
    if (data && data.ok){
      SCANDB = data;
      var n = Object.keys(data.students||{}).length;
      say('資料已載入（索引 '+n+' 筆），即時掃描中');
      r.className='show ok'; r.innerHTML='<div class="verdict">✅ 已就緒</div><div class="meta">已載入資料，請開始掃描</div>';
      setTimeout(function(){ if(!busy) r.className=''; }, 2000);
      if(cb) cb(true);
    }
    else if (data && data.reason==='auth'){
      try { sessionStorage.removeItem('scanToken'); } catch(e){} TOKEN='';
      say('登入已過期');
      r.className='show ban'; r.innerHTML='<div class="verdict">🔐 需要重新登入</div><div class="meta">登入已過期或無權限，請重新用學校帳號登入</div><div style="margin-top:12px"><button class="btn" onclick="goLogin()">🔐 重新登入</button></div>';
      if(cb) cb(false);
    }
    else {
      say('資料載入失敗');
      r.className='show none'; r.innerHTML='<div class="verdict">⚠️ 資料載入失敗</div><div class="meta">'+esc((data&&data.reason)||'未知')+'，請檢查網路後重新整理</div>';
      if(cb) cb(false);
    }
  });
}
function refreshDBMobile(){ if (TOKEN) jsonp({ action:'db', token:TOKEN }, function(data){ if (data && data.ok) SCANDB = data; }); }

function showLoginNeeded(){
  var r=document.getElementById('result');
  r.className='show ban';
  r.innerHTML='<div class="verdict">🔐 請先登入</div><div class="meta">請用學校 Google 帳號登入後開始掃描</div><div style="margin-top:12px"><button class="btn" onclick="goLogin()">🔐 用學校帳號登入</button></div>';
}

// ---- 背景寫入記錄（POST，號碼在 body 不進網址）----
function logBeacon(code){
  try {
    var body = 'action=log&code='+encodeURIComponent(code)+'&token='+encodeURIComponent(TOKEN);
    if (navigator.sendBeacon){ navigator.sendBeacon(APP_URL, new Blob([body], {type:'application/x-www-form-urlencoded'})); }
    else { fetch(APP_URL, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body }); }
  } catch(e){}
}

// ---- 本機即時比對（與後端邏輯一致）----
function pad2(n){ return ('0'+n).slice(-2); }
function fmtNow(d){ return d.getFullYear()+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function dayNum(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function locExtract(raw){ var s=String(raw||'').toUpperCase().replace(/[\s\-]/g,''); var m=s.match(/[A-Z][12]\d{8}/); return {id:m?m[0]:'', clean:s}; }
function locLookup(ex){ var S=(SCANDB&&SCANDB.students)||{};
  if(ex.id&&S[ex.id])return S[ex.id];
  if(ex.clean&&S[ex.clean])return S[ex.clean];
  if(ex.clean&&S['NO_'+ex.clean])return S['NO_'+ex.clean];
  return null; }
function locBan(st,now){ var rules=(SCANDB&&SCANDB.rules)||[], sno=String(st.sno||''); var day=dayNum(now), min=now.getHours()*60+now.getMinutes();
  for(var i=0;i<rules.length;i++){ var r=rules[i];
    if(!r.enabled)continue;
    if(r.prefix&&sno.indexOf(r.prefix)!==0)continue;
    if(r.sd!=null&&r.sd>day)continue;
    if(r.ed!=null&&r.ed<day)continue;
    if(r.st!=null&&r.st>min)continue;
    if(r.et!=null&&r.et<min)continue;
    return {banned:true, ruleName:r.name||'禁止外出時段'};
  } return {banned:false, ruleName:''}; }
function locNotes(st,now){ var day=dayNum(now), out=[], seen={}; var N=(SCANDB&&SCANDB.notes)||{}, colors=(SCANDB&&SCANDB.noteColors)||{};
  var idK=String(st.id||'').toUpperCase().replace(/\s/g,''), noK=String(st.sno||'').replace(/\s/g,'');
  var lists=[]; if(idK&&N[idK])lists.push(N[idK]); if(noK&&N['NO_'+noK])lists.push(N['NO_'+noK]);
  lists.forEach(function(a){a.forEach(function(rec){
    if(rec.sd!=null&&rec.sd>day)return; if(rec.ed!=null&&rec.ed<day)return;
    if(!seen[rec.name]){seen[rec.name]=1; out.push({name:rec.name,color:colors[rec.name]||'#f59e0b'});}
  });}); return out; }

function showWait(){ var r=document.getElementById('result'); r.className='show wait'; r.innerHTML='<div class="verdict">查詢中…</div>'; }
function autoHide(){ if(hideTimer) clearTimeout(hideTimer); hideTimer=setTimeout(function(){ document.getElementById('result').className=''; }, 3500); }

function handleResult(data){
  var r=document.getElementById('result');
  if (!data || data.ok===false){
    if (data && data.reason==='auth'){ try{sessionStorage.removeItem('scanToken');}catch(e){} TOKEN=''; r.className='show ban'; r.innerHTML='<div class="verdict">🔐 需要重新登入</div><div class="meta">登入已過期，請重新登入</div><div style="margin-top:12px"><button class="btn" onclick="goLogin()">🔐 重新登入</button></div>'; soundNone(); scheduleResume(1500); return; }
    r.className='show none'; r.innerHTML='<div class="verdict">⚠️ 連線失敗</div><div class="meta">請再掃一次</div>'; soundNone(); autoHide(); scheduleResume(800); return;
  }
  if (!data.found){
    r.className='show none'; r.innerHTML='<div class="verdict">❓ 查無此學生</div><div class="meta">'+esc(data.code||'')+'</div><div class="stamp">🕒 '+esc(data.timeStr)+'</div>';
    soundNone(); autoHide(); scheduleResume(800); return;
  }
  var s=data.student;
  var sub=esc(s.class)+'　座號 '+esc(s.seat)+'　學號 '+esc(s.sno);
  var html='';
  if (data.banned){ r.className='show ban'; html+='<div class="verdict">⛔ 禁止外出'+(data.ruleName?('　<span style="font-size:18px">'+esc(data.ruleName)+'</span>'):'')+'</div>'; }
  else { r.className='show ok'; html+='<div class="verdict">✅ 可外出</div>'; }
  html+='<div class="name">'+esc(s.name)+'</div><div class="meta">'+sub+'</div>';
  if (data.notes && data.notes.length){ html+='<div class="notes">';
    data.notes.forEach(function(n){ var col=n.color||'#f59e0b'; html+='<span class="chip" style="background:'+col+';color:'+textColorFor(col)+'">🏷️ '+esc(n.name)+'</span>'; });
    html+='</div>'; }
  html+='<div class="stamp">🕒 '+esc(data.timeStr)+'</div>';
  r.innerHTML=html;
  if (data.banned){ soundWarn(); scheduleResume(1500); }        // 禁止者：凍久一點方便處理
  else { soundPass(); autoHide(); scheduleResume(500); }         // 可外出者：很快恢復，避免人多堵塞
}

// ---- 手動輸入查詢（防冒名：可用身分證／學號／姓名／班級座號查出完整資料）----
function toggleManual(){
  var b=document.getElementById('manualBox');
  var show = b.style.display==='none';
  b.style.display = show ? 'block' : 'none';
  if (show){ document.getElementById('manualInput').focus(); }
}
function uniqueStudents(){
  var S=(SCANDB&&SCANDB.students)||{}, seen={}, list=[];
  Object.keys(S).forEach(function(k){ var st=S[k]; var key=(st.id||'')+'|'+(st.sno||'')+'|'+(st.name||''); if(!seen[key]){ seen[key]=1; list.push(st);} });
  return list;
}
function manualQuery(){
  var q=(document.getElementById('manualInput').value||'').trim();
  var box=document.getElementById('manualResults');
  if(!q){ box.innerHTML=''; return; }
  if(!SCANDB){
    if(!TOKEN){ showLoginNeeded(); return; }
    box.innerHTML='<div class="sub">載入資料中…</div>';
    loadDBMobile(function(ok){ if(ok) manualQuery(); });
    return;
  }
  var qU=q.toUpperCase().replace(/\s/g,'');
  var res=uniqueStudents().filter(function(st){
    var id=String(st.id||'').toUpperCase().replace(/\s/g,'');
    var sno=String(st.sno||'').replace(/\s/g,'');
    var cs=(String(st.class||'')+String(st.seat||'')).replace(/\s/g,'');
    return (id&&id===qU) || (sno&&sno===qU) || (cs&&cs===qU) || (String(st.name||'').indexOf(q)>=0);
  });
  if(!res.length){ box.innerHTML='<div class="result show none" style="margin-top:10px"><div class="verdict">❓ 查無符合</div></div>'; return; }
  if(res.length===1){ showManualResult(res[0]); return; }
  window.__manualRes=res;
  var html='<div style="margin-top:10px">符合 '+res.length+' 筆，請點選：';
  res.slice(0,20).forEach(function(st,i){
    html+='<button class="btn ghost" style="display:block;width:100%;text-align:left;margin-top:6px" onclick="pickManual('+i+')">'+esc(st.name)+'　'+esc(st.class)+' '+esc(st.seat)+'　學號 '+esc(st.sno)+'</button>';
  });
  html+='</div>';
  box.innerHTML=html;
}
function pickManual(i){ var st=(window.__manualRes||[])[i]; if(st) showManualResult(st); }
function showManualResult(st){
  var d=new Date(), ban=locBan(st,d), notes=locNotes(st,d);
  var box=document.getElementById('manualResults');
  var cls = ban.banned?'ban':'ok';
  var html='<div class="result show '+cls+'" style="margin-top:10px">';
  html+= ban.banned ? ('<div class="verdict">⛔ 禁止外出'+(ban.ruleName?'　<span style="font-size:16px">'+esc(ban.ruleName)+'</span>':'')+'</div>') : '<div class="verdict">✅ 可外出</div>';
  html+='<div class="name">'+esc(st.name)+'</div><div class="meta">'+esc(st.class)+'　座號 '+esc(st.seat)+'　學號 '+esc(st.sno)+'</div>';
  if(st.id) html+='<div class="meta" style="font-size:13px">身分證：'+esc(st.id)+'</div>';
  if(notes.length){ html+='<div class="notes">'; notes.forEach(function(n){ var c=n.color||'#f59e0b'; html+='<span class="chip" style="background:'+c+';color:'+textColorFor(c)+'">🏷️ '+esc(n.name)+'</span>'; }); html+='</div>'; }
  html+='<div style="margin-top:12px"><button class="btn" onclick="manualLog(this.getAttribute(\'data-c\'))" data-c="'+esc(st.id||st.sno)+'">✅ 登記此人外出</button></div>';
  html+='</div>';
  box.innerHTML=html;
  if(ban.banned) soundWarn(); else soundPass();
}
function manualLog(code){
  logBeacon(code);
  var box=document.getElementById('manualResults');
  box.innerHTML='<div class="result show ok" style="margin-top:10px"><div class="verdict">✅ 已登記外出</div></div>';
  setTimeout(function(){ box.innerHTML=''; }, 2000);
}

// ---- 單一入口：依裝置導向（手機→相機掃描；電腦→電腦版） ----
function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
         (('ontouchstart' in window) && Math.min(screen.width, screen.height) < 820);
}
function useCameraHere(){
  document.getElementById('desktopLanding').style.display='none';
  document.querySelector('.frame').style.display='inline-block';
  document.querySelector('.footer').style.display='block';
  document.getElementById('result').style.display='';   // 回復由 class 控制顯示
  say('請按「開始掃描」並允許使用相機');
}
(function initEntry(){
  var a=document.getElementById('adminLink'); if(a) a.href=ADMIN_URL;
  var p=document.getElementById('pcLink'); if(p) p.href=ADMIN_URL;
  if (!isMobile()){
    document.getElementById('desktopLanding').style.display='block';
    document.querySelector('.frame').style.display='none';
    document.getElementById('result').style.display='none';
    document.querySelector('.footer').style.display='none';
    say('偵測到電腦，請選擇進入方式');
    return;
  }
  // 手機：未登入先提示登入；已登入則等待按「開始掃描」
  if (!TOKEN){ showLoginNeeded(); say('請先用學校帳號登入'); }
  else { say('已登入，請按「開始掃描」'); }
})();
</script>
