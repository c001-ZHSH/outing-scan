<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>學生外出掃描</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  * { box-sizing:border-box; }
  body { font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; margin:0; background:#0f172a; color:#e2e8f0; }
  .wrap { max-width:640px; margin:0 auto; padding:14px; text-align:center; }
  h1 { font-size:19px; margin:6px 0 2px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:10px; }
  .frame { position:relative; display:inline-block; width:100%; max-width:560px; }
  #video { width:100%; aspect-ratio:3/4; background:#111; border-radius:16px; object-fit:cover; }
  .reticle { position:absolute; left:8%; right:8%; top:40%; height:20%; border:3px solid rgba(147,197,253,.9); border-radius:12px; pointer-events:none; }
  .start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); border-radius:16px; }
  .btn { border:0; border-radius:14px; padding:16px 24px; font-size:19px; font-weight:800; cursor:pointer; background:#2563eb; color:#fff; }
  .btn.ghost { background:#334155; font-size:14px; padding:9px 14px; font-weight:600; }
  #status { margin:8px 0; font-size:13px; color:#64748b; min-height:18px; }

  #result { display:none; border-radius:16px; padding:18px; margin-top:12px; text-align:center; }
  #result.show { display:block; }
  #result.ok   { background:#064e3b; border:3px solid #10b981; }
  #result.ban  { background:#7f1d1d; border:3px solid #ef4444; }
  #result.none { background:#3f3f46; border:3px solid #a1a1aa; }
  #result.wait { background:#1e293b; border:3px solid #334155; }
  .verdict { font-size:30px; font-weight:900; }
  .name { font-size:28px; font-weight:900; margin-top:4px; }
  .meta { font-size:16px; color:#e5e7eb; margin-top:4px; }
  .notes { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip { font-weight:800; padding:8px 15px; border-radius:999px; font-size:19px; }
  .stamp { font-size:12px; color:#cbd5e1; margin-top:10px; }
  .footer { margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎫 學生外出掃描</h1>
  <div class="sub">相機會一直開著，連續掃、不用重按</div>

  <div class="frame">
    <video id="video" muted playsinline autoplay></video>
    <div class="reticle"></div>
    <div class="start" id="startBox"><button class="btn" onclick="startScan()">▶ 開始掃描</button></div>
  </div>

  <div id="result"></div>

  <div class="footer">
    <button class="btn ghost" onclick="setKey()">🔑 設定通行碼</button>
  </div>
  <div id="status">請按「開始掃描」並允許使用相機</div>
</div>

<script>
// 手機專用「匿名端點」網址（以通行碼驗證，可連續查詢）
var APP_URL = "https://script.google.com/macros/s/AKfycbxNgiG6CP8SW81SpAJDFummkLbm5_0BmbVjoCeXddHzErYDzDopzEm8g6bC23rOtTJh/exec";

var KEY = localStorage.getItem('scanKey') || '';
var reader = null, busy=false, lastCode='', lastTime=0, hideTimer=null, resumeTimer=null, SCANDB=null, refreshSet=false;

function say(t){ document.getElementById('status').textContent = t; }

// 只辨識學生證／身分證常見的條碼類型，加快速度
function makeReader(){
  var hints = null;
  try {
    hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
    ]);
  } catch(e){ hints = null; }
  var r = hints ? new ZXing.BrowserMultiFormatReader(hints) : new ZXing.BrowserMultiFormatReader();
  try { r.timeBetweenDecodingAttempts = 100; } catch(e){}   // 更頻繁嘗試，反應更快
  return r;
}

// 掃到就凍結畫面（給「已擷取」回饋）；顯示完再恢復即時畫面
function freezeFrame(){ var v=document.getElementById('video'); try{ v.pause(); }catch(e){} }
function scheduleResume(delay){
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeTimer = setTimeout(function(){
    var v=document.getElementById('video'); try{ v.play(); }catch(e){}
    busy = false;
  }, delay);
}

// ---- 音效 ----
function actx(){ return window.__a || (window.__a = new (window.AudioContext||window.webkitAudioContext)()); }
function tone(freq,dur,type,when,gain){ try{ var C=actx(),o=C.createOscillator(),g=C.createGain();
  o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(C.destination);
  var t=C.currentTime+(when||0); g.gain.setValueAtTime(gain||0.3,t); o.start(t); o.stop(t+dur);}catch(e){} }
function beep(){ tone(1000,0.08,'sine',0,0.25); }
function soundPass(){ tone(880,0.12,'sine',0,0.3); }
function soundWarn(){ for(var i=0;i<4;i++){ tone(240,0.16,'square',i*0.2,0.35); tone(360,0.16,'square',i*0.2+0.02,0.3);} }
function soundNone(){ tone(160,0.35,'sawtooth',0,0.25); }

function textColorFor(hex){ var c=String(hex||'').replace('#',''); if(c.length===3){c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];}
  if(c.length<6) return '#111827'; var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return ((0.299*r+0.587*g+0.114*b)/255)>0.62 ? '#111827' : '#ffffff'; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function setKey(){
  var k = prompt('請輸入手機掃描通行碼（向管理者索取）：', KEY||'');
  if (k!=null){ KEY=k.trim(); localStorage.setItem('scanKey', KEY); say('通行碼已儲存'); if (KEY) loadDBMobile(); }
}

// ---- 啟動相機（連續）----
function startScan(){
  beep();
  if (!KEY){ setKey(); if(!KEY){ say('請先設定通行碼'); return; } }
  if (typeof ZXing === 'undefined'){ say('掃描元件載入中，請幾秒後再按一次…'); return; }
  if (!reader) reader = makeReader();
  say('正在啟動相機…');
  var p = reader.decodeFromConstraints({ video:{ facingMode:{ ideal:'environment' } } }, 'video',
    function(result, err){ if (result) onDecode(result.getText()); });
  if (p && p.then){ p.then(onCameraReady)
                     .catch(function(e){ say('無法開啟相機（'+((e&&e.name)||e)+'），請確認已允許相機權限，再按一次開始。'); }); }
  else { onCameraReady(); }
}
function onCameraReady(){
  document.getElementById('startBox').style.display='none';
  say('相機已開啟，載入資料中…');
  loadDBMobile();
  if (!refreshSet){ refreshSet=true; setInterval(refreshDBMobile, 180000); }   // 每 3 分鐘更新資料
}

function onDecode(text){
  var code = String(text||'').trim(); if(!code) return;
  var now = Date.now();
  if (busy) return;
  if (code===lastCode && (now-lastTime)<3500) return;   // 同一張卡短時間不重複
  lastCode=code; lastTime=now; busy=true;
  beep();
  freezeFrame();          // 凍結畫面，給「已擷取」回饋
  if (SCANDB){
    // 本機即時比對，0 秒出結果
    var d=new Date(), ex=locExtract(code), st=locLookup(ex), res;
    if (!st){ res={ ok:true, found:false, code:code, timeStr:fmtNow(d) }; }
    else { var ban=locBan(st,d), notes=locNotes(st,d);
      res={ ok:true, found:true, student:st, banned:ban.banned, ruleName:ban.ruleName, notes:notes, timeStr:fmtNow(d) }; }
    handleResult(res);
    logBeacon(code);      // 背景寫入記錄，不等待
  } else {
    // 尚未載入整包資料 → 即時查詢（備援，較慢）
    showWait();
    jsonp({ code:code, key:KEY }, function(data){ handleResult(data); });
  }
}

function jsonp(params, cb){
  var s=document.createElement('script');
  var name='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6), done=false;
  function cleanup(){ try{ delete window[name]; }catch(e){ window[name]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
  window[name]=function(d){ if(done)return; done=true; cleanup(); cb(d); };
  s.onerror=function(){ if(done)return; done=true; cleanup(); cb({ok:false,reason:'network'}); };
  var q=[]; for(var k in params){ q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  s.src=APP_URL+'?'+q.join('&')+'&callback='+name;
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){ done=true; cleanup(); cb({ok:false,reason:'timeout'}); } }, 12000);
}

// ---- 一次載入整包資料（之後本機即時比對）----
function loadDBMobile(cb){
  if (!KEY){ if(cb) cb(false); return; }
  jsonp({ action:'db', key:KEY }, function(data){
    if (data && data.ok){ SCANDB = data; say('資料已載入，連續即時掃描中'); if(cb) cb(true); }
    else if (data && data.reason==='key'){ say('通行碼錯誤，請重新設定'); setKey(); if(cb) cb(false); }
    else { say('資料載入失敗，暫時改用即時查詢'); if(cb) cb(false); }
  });
}
function refreshDBMobile(){ if (KEY) jsonp({ action:'db', key:KEY }, function(data){ if (data && data.ok) SCANDB = data; }); }

// ---- 背景寫入記錄（POST，號碼在 body 不進網址）----
function logBeacon(code){
  try {
    var body = 'action=log&code='+encodeURIComponent(code)+'&key='+encodeURIComponent(KEY);
    if (navigator.sendBeacon){ navigator.sendBeacon(APP_URL, new Blob([body], {type:'application/x-www-form-urlencoded'})); }
    else { fetch(APP_URL, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body }); }
  } catch(e){}
}

// ---- 本機即時比對（與後端邏輯一致）----
function pad2(n){ return ('0'+n).slice(-2); }
function fmtNow(d){ return d.getFullYear()+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function dayNum(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function locExtract(raw){ var s=String(raw||'').toUpperCase().replace(/[\s\-]/g,''); var m=s.match(/[A-Z][12]\d{8}/); return {id:m?m[0]:'', clean:s}; }
function locLookup(ex){ var S=(SCANDB&&SCANDB.students)||{};
  if(ex.id&&S[ex.id])return S[ex.id];
  if(ex.clean&&S[ex.clean])return S[ex.clean];
  if(ex.clean&&S['NO_'+ex.clean])return S['NO_'+ex.clean];
  return null; }
function locBan(st,now){ var rules=(SCANDB&&SCANDB.rules)||[], sno=String(st.sno||''); var day=dayNum(now), min=now.getHours()*60+now.getMinutes();
  for(var i=0;i<rules.length;i++){ var r=rules[i];
    if(!r.enabled)continue;
    if(r.prefix&&sno.indexOf(r.prefix)!==0)continue;
    if(r.sd!=null&&r.sd>day)continue;
    if(r.ed!=null&&r.ed<day)continue;
    if(r.st!=null&&r.st>min)continue;
    if(r.et!=null&&r.et<min)continue;
    return {banned:true, ruleName:r.name||'禁止外出時段'};
  } return {banned:false, ruleName:''}; }
function locNotes(st,now){ var day=dayNum(now), out=[], seen={}; var N=(SCANDB&&SCANDB.notes)||{}, colors=(SCANDB&&SCANDB.noteColors)||{};
  var idK=String(st.id||'').toUpperCase().replace(/\s/g,''), noK=String(st.sno||'').replace(/\s/g,'');
  var lists=[]; if(idK&&N[idK])lists.push(N[idK]); if(noK&&N['NO_'+noK])lists.push(N['NO_'+noK]);
  lists.forEach(function(a){a.forEach(function(rec){
    if(rec.sd!=null&&rec.sd>day)return; if(rec.ed!=null&&rec.ed<day)return;
    if(!seen[rec.name]){seen[rec.name]=1; out.push({name:rec.name,color:colors[rec.name]||'#f59e0b'});}
  });}); return out; }

function showWait(){ var r=document.getElementById('result'); r.className='show wait'; r.innerHTML='<div class="verdict">查詢中…</div>'; }
function autoHide(){ if(hideTimer) clearTimeout(hideTimer); hideTimer=setTimeout(function(){ document.getElementById('result').className=''; }, 3500); }

function handleResult(data){
  var r=document.getElementById('result');
  if (!data || data.ok===false){
    if (data && data.reason==='key'){ r.className='show ban'; r.innerHTML='<div class="verdict">🔑 通行碼錯誤</div><div class="meta">請重新設定通行碼</div>'; soundNone(); scheduleResume(1500); setTimeout(setKey, 400); return; }
    r.className='show none'; r.innerHTML='<div class="verdict">⚠️ 連線失敗</div><div class="meta">請再掃一次</div>'; soundNone(); autoHide(); scheduleResume(1200); return;
  }
  if (!data.found){
    r.className='show none'; r.innerHTML='<div class="verdict">❓ 查無此學生</div><div class="meta">'+esc(data.code||'')+'</div><div class="stamp">🕒 '+esc(data.timeStr)+'</div>';
    soundNone(); autoHide(); scheduleResume(1400); return;
  }
  var s=data.student;
  var sub=esc(s.class)+'　座號 '+esc(s.seat)+'　學號 '+esc(s.sno);
  var html='';
  if (data.banned){ r.className='show ban'; html+='<div class="verdict">⛔ 禁止外出'+(data.ruleName?('　<span style="font-size:18px">'+esc(data.ruleName)+'</span>'):'')+'</div>'; }
  else { r.className='show ok'; html+='<div class="verdict">✅ 可外出</div>'; }
  html+='<div class="name">'+esc(s.name)+'</div><div class="meta">'+sub+'</div>';
  if (data.notes && data.notes.length){ html+='<div class="notes">';
    data.notes.forEach(function(n){ var col=n.color||'#f59e0b'; html+='<span class="chip" style="background:'+col+';color:'+textColorFor(col)+'">🏷️ '+esc(n.name)+'</span>'; });
    html+='</div>'; }
  html+='<div class="stamp">🕒 '+esc(data.timeStr)+'</div>';
  r.innerHTML=html;
  if (data.banned){ soundWarn(); scheduleResume(2400); }        // 禁止者：畫面凍久一點、結果停留
  else { soundPass(); autoHide(); scheduleResume(1200); }        // 可外出者：快速恢復、結果淡出
}
</script>
</body>
</html>
